name: Check for new chapters

# Automatic checking is OFF: WebNovel's bot protection blocks GitHub's servers.
# To turn it back on (e.g. if that changes), restore these two lines under "on:":
#   schedule:
#     - cron: "*/15 * * * *"
on:
  workflow_dispatch:          # manual test only

permissions:
  contents: write             # lets the job save state.json back to the repo

concurrency:
  group: chapter-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check WebNovel and announce
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          WEBNOVEL_BOOK: ${{ secrets.WEBNOVEL_BOOK }}
          READER_ROLE_ID: ${{ secrets.READER_ROLE_ID }}
          MOD_WEBHOOK_URL: ${{ secrets.MOD_WEBHOOK_URL }}
          BOT_AVATAR_URL: ${{ secrets.BOT_AVATAR_URL }}
        run: python notifier.py

      - name: Save state
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "beta-system-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "Update chapter state"
            git push
          fi
